      <stop offset="0" stop-color="#ff8f87"/>
      <stop offset="1" stop-color="#ff625f"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b39cf7"/>
      <stop offset="1" stop-color="#7664d9"/>
