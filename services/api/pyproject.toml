[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "little-orbit-api"
version = "1.3.0"
description = "Little Orbit HTTP, WebSocket, and worker service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "fastapi==0.153.0",
  "httpx==0.28.1",
  "orjson==3.13.0",
  "pillow==13.0.0",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.6",
  "pypdf==6.21.1",
  "pymupdf==2.0",
  "prometheus-client==0.26.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pyotp==2.10.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
  "requests==2.34.2",
  "sqlalchemy[asyncio]==2.1.5",
  "uvicorn[standard]==0.54.0"
]

[project.optional-dependencies]
dev = [
  "jsonschema[format]==4.26.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "types-jsonschema==4.26.0.20261006",
  "types-qrcode==8.2.0.20260518"
]

[tool.hatch.build.targets.wheel]
packages = ["src/little_orbit_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["services/ai/src"]
