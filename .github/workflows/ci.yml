name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python infra/scripts/check_versions.py
      - run: python infra/scripts/check_docs.py
      - run: python infra/scripts/check_quality.py
      - run: pip install -e './services/api[dev]' -e './services/ai[dev]'
      - run: ruff check services
      - run: mypy services
      - run: pytest -q services/api/tests services/ai/tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: >-
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          && test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
      - run: >-
          ./gradlew
          :apps:android:domain:test
          :apps:android:data:testDebugUnitTest
          :apps:android:data:lintDebug
          :apps:android:mobile:testDebugUnitTest
          :apps:android:mobile:lintDebug
          :apps:android:wear:testDebugUnitTest
          :apps:android:wear:lintDebug
          :apps:android:mobile:assembleDebug
          :apps:android:wear:assembleDebug
          :apps:android:mobile:verifyWearArtifactIsolation
          --stacktrace
