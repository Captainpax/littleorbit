name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python infra/scripts/check_docs.py
      - run: python infra/scripts/check_quality.py
      - run: pip install -e './services/api[dev]' -e ./services/ai
      - run: ruff check services/api services/ai
      - run: mypy --config-file services/api/pyproject.toml services/api/src services/ai/src
      - run: pytest -q services/api/tests services/ai/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :apps:android:domain:test :apps:android:data:testDebugUnitTest :apps:android:data:lintDebug :apps:android:mobile:testDebugUnitTest :apps:android:mobile:lintDebug :apps:android:wear:testDebugUnitTest :apps:android:wear:lintDebug :apps:android:mobile:assembleDebug :apps:android:wear:assembleDebug --stacktrace
