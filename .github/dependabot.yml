version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      android-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      workflow-dependencies:
        patterns: ["*"]
