name: little-orbit

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "8180:8180"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - private
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8180/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *bounded-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8180}
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/status"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *bounded-logging

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic -c services/api/alembic.ini upgrade head && uvicorn little_orbit_api.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      RELEASE_STORAGE_DIR: /var/lib/little-orbit/releases
    volumes:
      - ../data/releases:/var/lib/little-orbit/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *bounded-logging

  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "little_orbit_api.worker"]
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    networks:
      - private
      - ai-private
    logging: *bounded-logging

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_orbit}
      POSTGRES_USER: ${POSTGRES_USER:-little_orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *bounded-logging

  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-private
      - model-egress
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
    logging: *bounded-logging

  model-init:
    image: ollama/ollama:0.11.10
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull qwen3:4b-instruct-2507-q4_K_M &&
        test "$(ollama list | awk '$1 == "qwen3:4b-instruct-2507-q4_K_M" {print $2}')" = "0edcdef34593"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-private
    logging: *bounded-logging

networks:
  edge:
  private:
  ai-private:
    internal: true
  model-egress:

volumes:
  postgres-data:
  ollama-data:
