services:
  worker:
    environment:
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:?set FCM_PROJECT_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FCM_SERVICE_ACCOUNT_FILE:?set FCM_SERVICE_ACCOUNT_FILE in .env}
        target: /run/secrets/firebase-service-account.json
        read_only: true
